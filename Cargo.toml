[package]
name = "substack-mcp"
version = "0.1.10"
edition = "2021"
description = "Unofficial Substack MCP — read and publish to Substack, single binary, no runtime required."
license = "MIT"

[[bin]]
name = "substack-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies", "multipart"], default-features = false }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
